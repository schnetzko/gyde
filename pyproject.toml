[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gyde"
version = "0.1.0"
description = "Gyde FastAPI CRUD Service"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "MIT" }
keywords = ["fastapi", "sqlalchemy", "crud"]
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
  "fastapi>=0.100.0,<0.101.0",
  "uvicorn[standard]>=0.23.0,<0.24.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg2-binary>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
]
optional-dependencies = { dev = ["pytest>=9.0,<10.0", "httpx>=0.27,<0.28"] }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx==0.27.2",
    "pytest>=9.0.3",
]
